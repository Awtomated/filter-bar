# ============================================================
# SonarQube Main Branch Analysis
# Runs on: push to master or develop
# Required: must run before PR decoration can work
# ============================================================

when:
  - event: push
    branch: [master, develop]

steps:
  - name: install-and-coverage
    image: node:22-alpine
    commands:
      - yarn install --frozen-lockfile
      - yarn test --coverage --coverageReporters=lcov

  - name: sonar-scan
    image: sonarsource/sonar-scanner-cli:latest
    depends_on: [install-and-coverage]
    environment:
      SONAR_HOST_URL:
        from_secret: SONAR_HOST_URL
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
    commands:
      - sonar-scanner -Dsonar.projectKey=${CI_REPO_NAME} -Dsonar.sources=src -Dsonar.tests=test
        -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        -Dsonar.exclusions=node_modules/**,coverage/** -Dsonar.branch.name=${CI_COMMIT_BRANCH}
        -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
