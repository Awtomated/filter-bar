# ============================================================
# PR Checks — lint, unit tests + coverage, packaged-build smoke test
# Runs on: pull_request
# Blocks the merge on failure.
# ============================================================

when:
  - event: pull_request

steps:
  - name: install
    image: node:22-alpine
    commands:
      - yarn install --frozen-lockfile

  - name: lint
    image: node:22-alpine
    depends_on: [install]
    commands:
      - yarn lint

  - name: test-with-coverage
    image: node:22-alpine
    depends_on: [install]
    commands:
      - yarn test --coverage --coverageReporters=lcov --coverageReporters=text-summary

  - name: build-smoke-test
    image: node:22-alpine
    depends_on: [install]
    commands:
      - yarn smoke-test
