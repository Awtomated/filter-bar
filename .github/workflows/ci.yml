# CI for @awtomated/filter-bar: lint, jest with the 90% global coverage gate, packaged-build
# smoke test. Replaces the Woodpecker pr-checks pipeline (same commands, same thresholds).
#
# Self-contained on purpose: the shared reusable workflow in awtomated-infra (private) cannot be
# called from this public repo, and the CI App secrets it needs are not shared with it.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22' # same major as the Woodpecker pipeline (node:22-alpine)
          cache: yarn
      - name: Install dependencies
        id: install
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn lint
      - name: Tests with coverage gate (90% global)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: >-
          yarn test --coverage --coverageReporters=lcov --coverageReporters=text-summary
          --coverageThreshold='{"global":{"branches":90,"functions":90,"lines":90,"statements":90}}'
      - name: Build smoke test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: yarn smoke-test
